<!doctype html>

<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;color:#242424;background:#fff}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
:root{--brand:#0f6cbd}

body input,body select{border:1px solid #c8c8c8;border-radius:3px;padding:6px 8px;font:inherit;width:100%;background:#fff}
body label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#444}
.wt-w{overflow-x:auto;margin:0 20px 20px}
.wt{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.wt th,.wt td{border:1px solid #dcdcdc;padding:7px 10px;text-align:left}
.wt th{background:#f4f6f9;font-weight:600}
.ct-h{background:#1d3a6e;color:#fff;padding:14px 20px;font-size:17px;font-weight:700;letter-spacing:1px}
.ct-h small{display:block;font-size:12px;font-weight:400;opacity:.8;letter-spacing:0}
.ct-bc{padding:10px 20px;font-size:12px;color:#666;border-bottom:1px solid #e5e5e5}
.ct-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:16px 20px;align-items:end}
.ct-go{background:#1d3a6e;color:#fff;border-radius:3px;padding:8px 18px;font-weight:600}
.ct-msg{margin:0 20px 16px;color:#a4262c}
.ct-note{margin:0 20px 20px;font-size:12px;color:#777;line-height:1.7}
.hc-h{background:#3f5a3a;color:#f6efe0;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hc-h b{font-size:18px;letter-spacing:2px}
.hc-h b,.hc-h span{cursor:pointer}
.hc-h span{font-size:13px;opacity:.85}.hc-h span:hover,.hc-h span.on{opacity:1;text-decoration:underline;text-underline-offset:4px}
.hc-hero{background:linear-gradient(120deg,#efe6d2,#e3d3ae);color:#3f5a3a;padding:34px 24px;display:flex;flex-direction:column;gap:6px}
.hc-hero small{letter-spacing:3px;font-size:11px}.hc-hero b{font-size:22px}.hc-hero span{font-size:13px;color:#6b5d3e}
.hc-sec .wt-w{margin:0 0 12px}.hc-sec{padding:6px 20px 10px}.hc-sec h3{font-size:15px;color:#3f5a3a;margin:14px 0 10px}
.hc-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.hc-card{border:1px solid #e6dcc6;border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:2px;position:relative}
.hc-card i{height:70px;border-radius:4px;background:#f4ecda;margin-bottom:6px}.hc-card span{color:#888;font-size:13px}
.hc-card em{position:absolute;top:14px;left:14px;background:#3f5a3a;color:#fff;font-style:normal;font-size:11px;padding:1px 6px;border-radius:3px}
.hc-news{list-style:none;padding:0;margin:0}.hc-news li{padding:8px 0;border-bottom:1px solid #eee;font-size:13px}.hc-news time{color:#888;margin-right:12px}
.hc-note{color:#666;font-size:13px}.hc-ft{margin-top:24px;padding:14px 20px;background:#f4f1ea;color:#888;font-size:12px}
.hc-ban{background:#efe6d2;color:#3f5a3a;padding:18px 20px;font-weight:600}
.hc-box{max-width:360px;margin:20px;display:flex;flex-direction:column;gap:12px}
.hc-go{background:#3f5a3a;color:#fff;border-radius:3px;padding:8px 18px;font-weight:600;align-self:flex-start}
.hc-tabs{display:flex;gap:4px;padding:12px 20px 0;border-bottom:1px solid #ddd}
.hc-tabs button{padding:8px 14px;border-radius:4px 4px 0 0}
.hc-tabs button.on{background:#3f5a3a;color:#fff}
.hc-who{padding:14px 20px 4px;color:#444}
.hc-again{border:1px solid #3f5a3a;color:#3f5a3a;border-radius:3px;padding:2px 8px;font-size:12px}
.hc-err{color:#a4262c;font-size:13px;min-height:1em}
.pt-h{background:#1b5e3b;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pt-h b{font-size:17px;letter-spacing:1px;cursor:pointer}.pt-h span{font-size:13px;opacity:.85;cursor:pointer}.pt-h span.on,.pt-h span:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
.pt-h i{margin-left:auto;font-style:normal;font-size:12px;opacity:.85}
.pt-sec{padding:6px 20px 10px}.pt-sec h3{font-size:15px;color:#1b5e3b;margin:14px 0 10px}
.pt-sec .wt-w{margin:0 0 12px}.pt-q{display:flex;gap:8px;max-width:460px;margin-bottom:12px}.pt-q input{flex:1}
.pt-go{background:#1b5e3b;color:#fff;border-radius:3px;padding:6px 16px;font-weight:600;white-space:nowrap}
.pt-row{cursor:pointer}.pt-row:hover td{background:#f3f8f5}.pt-dt{border:1px solid #cfe3d7;background:#f6fbf8;border-radius:4px;padding:12px 16px;margin:0 0 14px;font-size:13px;line-height:1.9;max-width:560px}
.ms-bg{min-height:100vh;background:#f2f2f2;display:flex;align-items:center;justify-content:center;padding:20px}
.ms-box{background:#fff;width:440px;max-width:100%;padding:40px 44px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ms-logo{display:flex;align-items:center;gap:8px;font-size:15px;color:#5e5e5e;margin-bottom:18px}.ms-logo i{display:grid;grid-template-columns:9px 9px;gap:1px}.ms-logo i b{width:9px;height:9px}
.ms-box h1{font-size:24px;font-weight:600;margin:0 0 6px}.ms-box p{margin:0 0 18px;font-size:13px;color:#555}
.ms-acc{display:flex;align-items:center;gap:12px;width:100%;padding:12px 8px;text-align:left;border-top:1px solid #e5e5e5}.ms-acc:hover{background:#f2f2f2}
.ms-acc span{width:40px;height:40px;border-radius:50%;background:#1b5e3b;color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.ms-acc small{display:block;color:#666}.ms-err{color:#a4262c;font-size:13px;margin-top:10px;min-height:1em}
.pt-land{min-height:100vh;background:linear-gradient(135deg,#1b5e3b,#2f7d55);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.pt-land b{font-size:26px;letter-spacing:2px}.pt-land small{opacity:.85}.pt-land button{background:#fff;color:#1b5e3b;border-radius:4px;padding:10px 26px;font-weight:600;margin-top:10px}
body a{color:var(--brand)}
@media (max-width:700px){.ct-f{grid-template-columns:1fr 1fr}.wt-w{margin:0 12px 16px}}
</style>
</head>

};
const HC_TABS = [["o","Order History"],["r","Scheduled orders"],["g","Organizer settings"]];
const HC_RSV = `<tr><td>Every Thu 13:40</td><td>Four Seasons Oolong · light sugar, no ice ×1</td><td>B1 Meeting Room</td><td>Yi-En Chou (2026/9/16)</td><td>Active</td><td>11/5 (Thu)</td></tr>`;
const HC_DASH = () => `<div class="hc-who">Qinghe Foods Co., Ltd. · Corporate Planning (business account qinghe-plan) · Organizer: <b>Yi-En Chou</b> · <a href="#" id="hc-out">Sign out</a></div>
<div class="hc-tabs">${HC_TABS.map(([k, t]) => `<button data-hc="${k}" class="${web.hcTab === k ? "on" : ""}">${t}</button>`).join("")}</div>` + ({
  o: () => `<p style="margin:14px 20px 10px;color:#666;font-size:13px">Orders from the last 60 days</p><div class="wt-w"><table class="wt"><tr><th>Ordered</th><th>Items</th><th>Amount</th><th>Deliver to</th><th>Notes</th><th></th></tr>${HC_ORDERS.map(o => `<tr><td>${o[0]}</td><td>${o[1]}</td><td>$${o[2]}</td><td>${o[3]}</td><td>${o[4]}</td><td>${/Group order/.test(o[1]) ? `<button class="hc-again" data-again="${o[1]}|${o[2]}">Order again</button>` : ""}</td></tr>`).join("")}</table></div>`,
  r: () => `<p style="margin:14px 20px 10px;color:#666;font-size:13px">Scheduled orders are placed automatically at the set time and billed monthly to the business account.</p><div class="wt-w"><table class="wt"><tr><th>Delivery time</th><th>Items</th><th>Deliver to</th><th>Created by</th><th>Status</th><th>Next delivery</th></tr>${HC_RSV}</table></div>`,
  g: () => `<form class="hc-box" id="hc-g"><label>Current organizer<input value="Yi-En Chou" disabled></label><label>New organizer's name<input id="hc-g-n" autocomplete="off"></label><div class="hc-err" id="hc-g-err"></div><button class="hc-go">Request transfer</button></form>`,
  n: () => `<form class="hc-box" id="hc-n" style="max-width:420px"><b>Confirm order</b><label>Items<input value="${web.again[0]} (same as 10/1 order)" disabled></label>
<label>Delivery date<select id="hc-d"><option value="">Select</option>${["11/3 (Tue)","11/4 (Wed)","11/5 (Thu)","11/6 (Fri)"].map(d => `<option>${d}</option>`).join("")}</select></label>
<label>Delivery time<select id="hc-t"><option value="">Select</option>${["14:00","14:30","15:00","15:30","16:00"].map(d => `<option>${d}</option>`).join("")}</select></label>
<label>Deliver to<input id="hc-l" value="12F pantry" autocomplete="off"></label><div style="font-size:13px;color:#666">Amount $${Math.round(web.again[1] * .9)} (partner 10% off) · monthly billing</div><div class="hc-err" id="hc-n-err"></div><button class="hc-go">Place order</button></form>`,
  ok: () => `<div class="hc-box" style="max-width:520px"><b style="font-size:17px;color:#3f5a3a">✓ Order placed</b><div>Order no. ${web.last.no}</div><div>${web.again[0]} · delivered ${web.last.d} ${web.last.t} to ${web.last.l}</div><div style="color:#666;font-size:13px">A confirmation has been sent to the account's linked mailbox, plan@qinghe-foods.com.tw.</div></div>
<p style="margin:0 20px 8px;font-size:13px;color:#666">This account also has the following scheduled orders:</p><div class="wt-w"><table class="wt"><tr><th>Delivery time</th><th>Items</th><th>Deliver to</th><th>Created by</th><th>Status</th><th>Next delivery</th></tr>${HC_RSV}</table></div>`,
}[web.hcTab])();
function openWeb(site){
  web.site = site; const w = WEB[site];
  webPg.innerHTML = w.draw(); document.title = w.title; scrollTo(0, 0);
}
// URLs #court, #hecha, #hecha/biz; pages use the hash so the browser back button works
function route(){ const [site, pg] = location.hash.slice(1).split("/"); if (!WEB[site]) return; if (site === "hecha") web.hcPg = HC_PATH[pg] ? pg : "home"; if (site === "portal") web.ptPg = PT_PATH[pg] ? pg : "home"; openWeb(site); }
addEventListener("hashchange", route);
webPg.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target;
  if (f.id === "ct-f"){
    const c = document.getElementById("ct-c").value, y = document.getElementById("ct-y").value.trim(), w = document.getElementById("ct-w").value, n = document.getElementById("ct-n").value.trim().replace(/^0+/, "");
    const r = document.getElementById("ct-r");
    if (!c) return r.innerHTML = `<p class="ct-msg">Please select a court.</p>`;
    if (c === "tp" && y === "115" && w === "su" && n === "812")
      return r.innerHTML = `<p style="margin:0 20px 10px">Taiwan Taipei District Court · Case No. 115-Su-812 · Payment for goods</p><div class="wt-w"><table class="wt"><tr><th>Hearing date</th><th>Time</th><th>Courtroom</th><th>Type</th><th>Est. duration</th></tr>${COURT_HEAR.map(h => `<tr>${h.map(x => `<td>${x}</td>`).join("")}</tr>`).join("")}</table></div>`;
    return r.innerHTML = `<p class="ct-msg">No records found. Please check the court, year, case type and case number.</p>`;
  }
  if (f.id === "pt-q"){ web.ptQ = document.getElementById("pt-in").value; return openWeb("portal"); }
  if (f.id === "hc-lg"){
    const u = document.getElementById("hc-u").value.trim().toLowerCase(), pw = document.getElementById("hc-p").value.trim();
    if (u === "qinghe-plan" && pw === "hecha3109"){ web.hcIn = true; web.hcTab = "o"; return openWeb("hecha"); }
    return document.getElementById("hc-err").textContent = "Incorrect account or password. Please try again.";
  }
  if (f.id === "hc-mem") return document.getElementById("hc-m-err").textContent = /^09\d{8}$/.test(document.getElementById("hc-m").value.trim()) ? "Incorrect mobile number or password." : "Please enter a 10-digit mobile number.";
  if (f.id === "hc-n"){
    const d = document.getElementById("hc-d").value, t = document.getElementById("hc-t").value, l = document.getElementById("hc-l").value.trim();
    if (!d || !t || !l) return document.getElementById("hc-n-err").textContent = "Please choose a delivery date and time and enter a location.";
    web.last = {d, t, l, no:"HC1105-0" + (312 + (web.n = (web.n || 0) + 1))}; HC_ORDERS.unshift(["11/2 (Mon) " + new Date().toTimeString().slice(0, 5), web.again[0], Math.round(web.again[1] * .9), l, `Delivery ${d} ${t}`]);
    // notify the game tab (storage event on same-origin localStorage)
    const order = {...web.last, at:Date.now()};
    try { localStorage.setItem("qinghe-hc-order", JSON.stringify(order)); } catch (_) {}
    try { window.opener && window.opener.postMessage({type:"qinghe-hc-order", order}, location.origin); } catch (_) {}
    web.hcTab = "ok"; return openWeb("hecha");
  }
  if (f.id === "hc-g"){
    const n = document.getElementById("hc-g-n").value.trim();
    document.getElementById("hc-g-err").textContent = !n ? "Please enter the new organizer's name." : "Transfers must be verified by SMS from the current organizer, whose mobile number has been disconnected. Please contact customer service.";
  }
});
webPg.addEventListener("click", e => {
  const pg = e.target.closest("[data-hcp]"); if (pg){ location.hash = "hecha/" + pg.dataset.hcp; return; }
  const pp = e.target.closest("[data-ptp]"); if (pp){ location.hash = "portal/" + pp.dataset.ptp; return; }
  const pa = e.target.closest("[data-pta]"); if (pa){ const v = pa.dataset.pta;
    if (v === "1"){ web.ptAuth = 1; return openWeb("portal"); }
    if (v === "other") return document.getElementById("ms-err").textContent = "This app only accepts Qinghe Foods domain accounts.";
    try { localStorage.setItem("qinghe-portal-in", "1"); } catch (_) {} web.ptAuth = 0; return openWeb("portal"); }
  const pk = e.target.closest("[data-pk]"); if (pk){ web.ptOpen = web.ptOpen === +pk.dataset.pk ? -1 : +pk.dataset.pk; return openWeb("portal"); }
  const a = e.target.closest("[data-again]"); if (a){ const [n, p] = a.dataset.again.split("|"); web.again = [n, +p]; web.hcTab = "n"; return openWeb("hecha"); }
  const t = e.target.closest("[data-hc]"); if (t){ web.hcTab = t.dataset.hc; return openWeb("hecha"); }
  if (e.target.closest("#pt-out")){ e.preventDefault(); try { localStorage.removeItem("qinghe-portal-in"); } catch (_) {} return openWeb("portal"); }
  if (e.target.closest("#hc-out")){ e.preventDefault(); web.hcIn = false; openWeb("hecha"); }
});
route();
</script>
</body>
</html>
